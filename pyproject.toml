[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "REST API that measures features in KML / Shapefile uploads with correct CRS handling"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI's Depends()/File()/Query() in argument defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
